name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build application
        run: mvn --batch-mode clean package -DskipTests
      - name: Package Windows app with bundled Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item target/bank-management-system-1.0.0.jar staging/
          jpackage --type app-image --input staging --main-jar bank-management-system-1.0.0.jar --main-class bank.management.system.Login --name BankManagementSystem --app-version 1.0.0 --dest dist
          Compress-Archive -Path dist/BankManagementSystem -DestinationPath dist/BankManagementSystem-Windows-x64.zip -Force
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: BankManagementSystem-Windows-x64
          path: dist/BankManagementSystem-Windows-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/BankManagementSystem-Windows-x64.zip --title "Bank Management System $env:GITHUB_REF_NAME" --generate-notes
